# SPDX-License-Identifier: AGPL-3.0-or-later
# Dependency updates (ADR-0002, ADR-0007 SLAs). Dependabot PRs are exempt from the ticket-key
# and sign-off rules; a human links the ticket when merging. Cooldown is 7 days (zizmor dependabot-cooldown); security updates bypass it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Types follow the oldest supported Node LTS (ADR-0003); majors are bumped by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci(deps)'
  - package-ecosystem: github-actions
    directory: /.github/actions/setup
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci(deps)'
  - package-ecosystem: pip
    directory: /infra/ci
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci(deps)'
