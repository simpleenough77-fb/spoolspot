<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpoolSpot</title>
    <link rel="stylesheet" href="app.css" />
    <script src="summary.js" defer></script>
  </head>
  <body>
    <main>
      <h1>SpoolSpot</h1>
      <p>
        Development preview: how many locations the app knows about, by type. This build uses plain
        HTTP and a single development token. Use it only on your own network.
      </p>

      <form id="token-form">
        <label for="token">Development token</label>
        <input
          id="token"
          name="token"
          type="password"
          autocomplete="current-password"
          autocapitalize="off"
          spellcheck="false"
          required
        />
        <button type="submit">Show location counts</button>
      </form>

      <p id="status" role="status">Enter your development token to load the counts.</p>

      <table id="summary" hidden>
        <caption>
          Locations by type
        </caption>
        <thead>
          <tr>
            <th scope="col">Type</th>
            <th scope="col">Locations</th>
            <th scope="col">Places</th>
          </tr>
        </thead>
        <tbody id="summary-rows"></tbody>
        <tfoot>
          <tr>
            <th scope="row">All locations</th>
            <td id="summary-total"></td>
            <td></td>
          </tr>
        </tfoot>
      </table>

      <p><a href="https://github.com/simpleenough77-fb/spoolspot">Source code</a></p>
    </main>
  </body>
</html>
